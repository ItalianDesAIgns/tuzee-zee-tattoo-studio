<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="#151413">
  <defs>
    <!-- long compass point (cardinals) -->
    <path id="pL" d="M32 1 L34.2 15 L29.8 15 Z"/>
    <!-- short compass point (diagonals) -->
    <path id="pS" d="M32 5.5 L33.9 15 L30.1 15 Z"/>
    <!-- lotus petal, sits between the points -->
    <path id="petal" d="M32 7.5 C36.8 11 37.2 14.6 32 18 C26.8 14.6 27.2 11 32 7.5 Z"/>
    <!-- centre rosette petal -->
    <path id="ros" d="M32 22.6 C34 25.2 34 27.4 32 29.2 C30 27.4 30 25.2 32 22.6 Z"/>
  </defs>
  <g>
    <use href="#pL"/><use href="#pL" transform="rotate(90 32 32)"/>
    <use href="#pL" transform="rotate(180 32 32)"/><use href="#pL" transform="rotate(270 32 32)"/>
    <use href="#pS" transform="rotate(45 32 32)"/><use href="#pS" transform="rotate(135 32 32)"/>
    <use href="#pS" transform="rotate(225 32 32)"/><use href="#pS" transform="rotate(315 32 32)"/>
  </g>
  <g>
    <use href="#petal" transform="rotate(22.5 32 32)"/><use href="#petal" transform="rotate(67.5 32 32)"/>
    <use href="#petal" transform="rotate(112.5 32 32)"/><use href="#petal" transform="rotate(157.5 32 32)"/>
    <use href="#petal" transform="rotate(202.5 32 32)"/><use href="#petal" transform="rotate(247.5 32 32)"/>
    <use href="#petal" transform="rotate(292.5 32 32)"/><use href="#petal" transform="rotate(337.5 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="11.6" fill="none" stroke="#151413" stroke-width="2.4"/>
  <g>
    <use href="#ros"/><use href="#ros" transform="rotate(45 32 32)"/>
    <use href="#ros" transform="rotate(90 32 32)"/><use href="#ros" transform="rotate(135 32 32)"/>
    <use href="#ros" transform="rotate(180 32 32)"/><use href="#ros" transform="rotate(225 32 32)"/>
    <use href="#ros" transform="rotate(270 32 32)"/><use href="#ros" transform="rotate(315 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="2" fill="#151413"/>
</svg>
