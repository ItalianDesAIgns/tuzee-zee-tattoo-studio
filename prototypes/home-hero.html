<style>
/* ---------- shared ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.mark { display: inline-block; background: currentColor; -webkit-mask: url(../logo-lab/a-compass.svg) center / contain no-repeat; mask: url(../logo-lab/a-compass.svg) center / contain no-repeat; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:lang(ko) { word-break: keep-all; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes fade { from { opacity: 0; } }
.in { animation: rise 520ms cubic-bezier(0.23, 1, 0.32, 1) backwards; }
.in.d1 { animation-delay: 60ms; } .in.d2 { animation-delay: 120ms; } .in.d3 { animation-delay: 180ms; } .in.d4 { animation-delay: 240ms; }
@media (prefers-reduced-motion: no-preference) {

    .reveal { animation: rise linear backwards; animation-timeline: view(); animation-range: entry 0% entry 60%; }
  }
}
@media (prefers-reduced-motion: reduce) {
  .in { animation: none; }
}
/* Re-renders that are not a fresh visit (language switch) must not replay the entrance. */
#stage[data-static] .in, #stage[data-static] .hero > img, #stage[data-static] .photo img { animation: none; }

/* ======================================================
   1. PAPER: light paper base, drawing-led, calm serif
   ====================================================== */
.v-paper { --bg: #f4f1ea; --ink: #1a1917; --muted: #67625a; --line: #d9d3c7; --accent: #8a3b2b;
  background: var(--bg); color: var(--ink); font-family: Inter, "Noto Sans KR", system-ui, sans-serif; line-height: 1.55; min-height: 100vh; }
.v-paper .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .v-paper .wrap { padding: 0 32px; } }
.v-paper header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; }
.v-paper .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.v-paper .brand .mark { width: 34px; height: 34px; }
.v-paper .brand b { font-family: Fraunces, "Noto Serif KR", serif; font-weight: 600; letter-spacing: .22em; font-size: 1.05rem; }
.v-paper .brand small { display: block; font-size: .62rem; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.v-paper nav { display: flex; align-items: center; gap: 18px; font-size: .9rem; }
.v-paper nav a { text-decoration: none; color: var(--muted); }

.v-paper .navlinks { display: none; gap: 18px; }
@media (min-width: 720px) { .v-paper .navlinks { display: flex; } }
.lang { display: inline-flex; border: 1px solid currentColor; border-radius: 999px; padding: 2px; font-size: .75rem; opacity: .8; }
.lang button { border: 0; background: transparent; padding: 4px 9px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: currentColor; }
.lang button[aria-pressed="true"] span { filter: invert(1); }
.v-paper .lang button[aria-pressed="true"] span, .v-studio .lang button[aria-pressed="true"] span { color: var(--bg); filter: none; }
.v-ink .lang button[aria-pressed="true"] span { color: #0d0d0c; filter: none; }

.v-paper .hero { display: grid; gap: 32px; padding: 24px 0 56px; align-items: center; }

.v-paper .kicker { font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0 0 18px; }
.v-paper h1 { font-family: Fraunces, "Noto Serif KR", serif; font-weight: 400; font-size: clamp(2.2rem, 1.2rem + 3.6vw, 4.1rem); line-height: 1.08; letter-spacing: -.01em; margin: 0 0 20px; text-wrap: balance; }
.v-paper .lede { font-size: 1.08rem; color: var(--muted); max-width: 46ch; margin: 0 0 28px; text-wrap: pretty; }
.v-paper .ctas { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 999px; text-decoration: none; font-weight: 500; font-size: .95rem; transition: transform 160ms ease-out, background-color 160ms ease-out, color 160ms ease-out; }

.v-paper .btn-primary { background: var(--ink); color: var(--bg); }
.v-paper .btn-primary:hover { background: #33302b; }
.v-paper .btn-ghost { border: 1px solid var(--line); }
.v-paper .btn-ghost:hover { border-color: var(--ink); }
.v-paper .drawing { position: relative; aspect-ratio: 1; border-radius: 4px; overflow: hidden; background: #fff; box-shadow: 0 1px 0 var(--line), 0 30px 60px -30px rgba(40, 30, 20, .35); }
.v-paper .drawing img { width: 100%; height: 100%; object-fit: cover; }
.v-paper .drawing figcaption { position: absolute; left: 12px; bottom: 12px; font-size: .75rem; background: rgba(244,241,234,.92); padding: 4px 10px; border-radius: 999px; color: var(--muted); }
.v-paper section { padding: 64px 0; border-top: 1px solid var(--line); }
.v-paper h2 { font-family: Fraunces, "Noto Serif KR", serif; font-weight: 400; font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.4rem); margin: 0 0 8px; }
.v-paper .sub { color: var(--muted); margin: 0 0 32px; max-width: 60ch; }
.v-paper .pair { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; align-items: end; }
.v-paper .pair figure { margin: 0; }
.v-paper .pair img { aspect-ratio: 4 / 5; object-fit: cover; width: 100%; border-radius: 4px; }
.v-paper .pair figcaption { font-size: .82rem; color: var(--muted); margin-top: 8px; }
.v-paper .styles { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 32px 0 0; }

.v-paper .steps { display: grid; gap: 28px; list-style: none; padding: 0; margin: 0; counter-reset: s; }

.v-paper .steps li { counter-increment: s; }
.v-paper .steps li::before { content: counter(s, decimal-leading-zero); display: block; font-family: Fraunces, serif; font-size: 2rem; color: var(--accent); margin-bottom: 6px; }
.v-paper .steps h3 { font-size: 1.05rem; margin: 0 0 6px; }
.v-paper .steps p { margin: 0; color: var(--muted); font-size: .95rem; }
.v-paper .channels { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
.v-paper footer { padding: 32px 0 120px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }

/* ======================================================
   2. INK: dark base, photo-led, condensed grotesk
   ====================================================== */
.v-ink { --bg: #0d0d0c; --fg: #efebe4; --muted: #a29d94; --line: #2a2926; --accent: #d8573c;
  background: var(--bg); color: var(--fg); font-family: Inter, "Noto Sans KR", system-ui, sans-serif; line-height: 1.55; min-height: 100vh; }
.v-ink .wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px; }

.v-ink header { position: absolute; inset: 0 0 auto; z-index: 2; }
.v-ink header .wrap { display: flex; align-items: center; justify-content: space-between; padding-top: 18px; padding-bottom: 18px; }
.v-ink .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.v-ink .brand .mark { width: 30px; height: 30px; }
.v-ink .brand b { font-family: Archivo, "Noto Sans KR", sans-serif; font-stretch: 125%; font-weight: 700; letter-spacing: .14em; font-size: .95rem; }
.v-ink nav { display: flex; align-items: center; gap: 18px; font-size: .88rem; }
.v-ink .navlinks { display: none; gap: 18px; }

.v-ink .hero { position: relative; min-height: min(100svh, 920px); display: grid; align-items: end; overflow: hidden; }
.v-ink .hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; animation: fade 900ms ease-out backwards; }
.v-ink .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(13,13,12,.96) 8%, rgba(13,13,12,.55) 45%, rgba(13,13,12,.15) 75%, rgba(13,13,12,.55)); }
.v-ink .hero .wrap { position: relative; z-index: 1; padding-bottom: 48px; width: 100%; }
.v-ink .kicker { display: inline-block; font-size: .75rem; letter-spacing: .24em; text-transform: uppercase; color: var(--fg); background: rgba(13,13,12,.55); padding: 6px 10px; border-left: 2px solid var(--accent); margin: 0 0 14px; }
.v-ink h1 { font-family: Archivo, "Noto Sans KR", sans-serif; font-stretch: 62%; font-weight: 800; text-transform: uppercase; font-size: clamp(3rem, 1.4rem + 7vw, 7.2rem); line-height: .9; letter-spacing: -.005em; margin: 0 0 22px; max-width: 12ch; text-wrap: balance; }
.v-ink h1:lang(ko) { font-size: clamp(2.2rem, 1.2rem + 4.6vw, 4.6rem); line-height: 1.1; max-width: 14ch; }
.v-ink .lede { max-width: 44ch; color: #cfcac2; font-size: 1.05rem; margin: 0 0 26px; text-wrap: pretty; }
.v-ink .ctas { display: flex; flex-wrap: wrap; gap: 10px; }
.v-ink .btn-primary { background: var(--fg); color: var(--bg); }
.v-ink .btn-primary:hover { background: #fff; }
.v-ink .btn-ghost { border: 1px solid rgba(239,235,228,.3); }
.v-ink .btn-ghost:hover { border-color: var(--fg); }
.v-ink section { padding: 72px 0; }
.v-ink h2 { font-family: Archivo, "Noto Sans KR", sans-serif; font-stretch: 62%; font-weight: 700; text-transform: uppercase; font-size: clamp(2rem, 1.3rem + 2.6vw, 3.4rem); line-height: 1; margin: 0 0 10px; }
.v-ink .sub { color: var(--muted); margin: 0 0 28px; max-width: 58ch; }
/* Rail edge lines up with .wrap content; scroll-padding keeps snapping from eating the inset. */
.v-ink .rail { --inset: 16px; display: grid; grid-auto-flow: column; grid-auto-columns: min(78vw, 360px); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 var(--inset) 16px; scroll-padding-inline: var(--inset); scrollbar-width: thin; scrollbar-color: #3a3833 transparent; }
@media (min-width: 720px) { .v-ink .rail { --inset: max(32px, calc((100% - 1320px) / 2 + 32px)); } }
.v-ink .rail figure { margin: 0; scroll-snap-align: start; }
.v-ink .rail img { aspect-ratio: 3 / 4; width: 100%; object-fit: cover; border-radius: 2px; filter: saturate(.92); transition: filter 200ms ease-out; }
.v-ink .rail figure:hover img { filter: saturate(1.05); }
.v-ink .rail figcaption { display: flex; justify-content: space-between; gap: 12px; font-size: .82rem; color: var(--muted); margin-top: 10px; }
.v-ink .rail figcaption span:last-child { color: var(--accent); }
.v-ink .book { display: grid; gap: 32px; border-top: 1px solid var(--line); }
@media (min-width: 900px) { .v-ink .book { grid-template-columns: 1fr 1.3fr; align-items: start; } }
.v-ink .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.v-ink .steps li { display: grid; grid-template-columns: 56px 1fr; gap: 8px; padding: 18px 0; border-top: 1px solid var(--line); }
.v-ink .steps li:last-child { border-bottom: 1px solid var(--line); }
.v-ink .steps .n { font-family: Archivo, sans-serif; font-stretch: 62%; font-weight: 800; font-size: 1.6rem; color: var(--accent); line-height: 1.2; }
.v-ink .steps h3 { margin: 0 0 4px; font-size: 1.02rem; }
.v-ink .steps p { margin: 0; color: var(--muted); font-size: .94rem; }
.v-ink .channels { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.v-ink footer { padding: 28px 0 120px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }

/* ======================================================
   3. STUDIO: split editorial, person-led, warm
   ====================================================== */
.v-studio { --bg: #faf7f2; --ink: #22201c; --muted: #6f695f; --line: #e6dfd3; --panel: #2b2622; --accent: #b0462d;
  background: var(--bg); color: var(--ink); font-family: Manrope, "Noto Sans KR", system-ui, sans-serif; line-height: 1.55; min-height: 100vh; }
.v-studio .split { display: grid; min-height: min(100svh, 940px); }
@media (min-width: 960px) { .v-studio .split { grid-template-columns: 1fr 1fr; } }
.v-studio .photo { position: relative; min-height: 62svh; background: #ccc; overflow: hidden; }
.v-studio .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; animation: fade 700ms ease-out backwards; }
.v-studio .photo .tag { position: absolute; left: 16px; bottom: 16px; background: rgba(250,247,242,.94); color: var(--ink); font-size: .78rem; padding: 6px 12px; border-radius: 999px; }
.v-studio .copy { display: flex; flex-direction: column; padding: 20px 16px 48px; }
@media (min-width: 720px) { .v-studio .copy { padding: 28px 48px 56px; } }
.v-studio header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.v-studio .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.v-studio .brand .mark { width: 30px; height: 30px; color: var(--accent); }
.v-studio .brand b { font-weight: 700; letter-spacing: .2em; font-size: .9rem; }
.v-studio nav { display: flex; align-items: center; gap: 16px; font-size: .88rem; }
.v-studio .navlinks { display: none; gap: 16px; }
.v-studio .navlinks a { text-decoration: none; color: var(--muted); }
@media (min-width: 720px) { .v-studio .navlinks { display: flex; } }
.v-studio .intro { margin: auto 0; padding: 48px 0 32px; max-width: 520px; }
.v-studio .hello { font-family: Newsreader, "Noto Serif KR", serif; font-style: italic; font-size: 1.35rem; color: var(--accent); margin: 0 0 10px; }
.v-studio h1 { font-family: Newsreader, "Noto Serif KR", serif; font-weight: 400; font-size: clamp(2.1rem, 1.3rem + 2.8vw, 3.6rem); line-height: 1.1; margin: 0 0 18px; text-wrap: balance; }
.v-studio .lede { color: var(--muted); font-size: 1.04rem; margin: 0 0 18px; text-wrap: pretty; }
.v-studio .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; padding: 0; margin: 0 0 28px; font-size: .86rem; }
.v-studio .facts li::before { content: "·"; margin-right: 8px; color: var(--accent); }
.v-studio .card { background: var(--panel); color: #f3eee6; border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.v-studio .card p { margin: 0; font-size: .9rem; color: #c9c1b5; }
.v-studio .card .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.v-studio .chan { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; border-radius: 10px; background: rgba(255,255,255,.07); text-decoration: none; font-size: .85rem; transition: background-color 160ms ease-out, transform 160ms ease-out; }

.v-studio .chan:active { transform: scale(0.97); }
.v-studio .chan small { font-size: .7rem; color: #a99f92; }
.v-studio .work { padding: 64px 16px 40px; max-width: 1240px; margin: 0 auto; }
@media (min-width: 720px) { .v-studio .work { padding: 80px 32px 48px; } }
.v-studio .work-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.v-studio h2 { font-family: Newsreader, "Noto Serif KR", serif; font-weight: 400; font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.6rem); margin: 0; }
.v-studio .filters { display: flex; flex-wrap: wrap; gap: 6px; }
.v-studio .filters button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 13px; font-size: .84rem; cursor: pointer; transition: background-color 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out; }

.v-studio .grid { columns: 2 160px; column-gap: 12px; }

.v-studio .grid figure { margin: 0 0 12px; break-inside: avoid; position: relative; border-radius: 8px; overflow: hidden; }
.v-studio .grid figure[hidden] { display: none; }
.v-studio .grid img { width: 100%; }
.v-studio .grid figcaption { position: absolute; inset: auto 0 0; padding: 28px 12px 10px; font-size: .8rem; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.6)); opacity: 0; transform: translateY(4px); transition: opacity 180ms ease-out, transform 180ms ease-out; }

.v-studio .grid figure a { position: absolute; inset: 0; }

/* ---------- picker (verbatim spec) ---------- */
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }

.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }

</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Paper</button>

  <button class="proto-picker-item">Studio</button>

<script>
// ---------- content ----------
const IMG = '../images/';

  { f: 'applications/oriental-irezumi/irezumi-twin-koi-lotus-full-back-tattoo-tuzee.jpg', s: 'oriental', en: 'Twin koi and lotus, full back', ko: '쌍잉어와 연꽃, 전체 등' },

const variants = [paper, ink, studio];

// ---------- picker wiring (verbatim reference) ----------
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  delete stage.dataset.static;
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

// ---------- in-variant interactions (language toggle, style filter) ----------
stage.addEventListener('click', (e) => {
  const l = e.target.closest('[data-lang]');
  if (l && l.dataset.lang !== lang) {
    lang = l.dataset.lang;
    document.documentElement.lang = lang;
    stage.dataset.static = '';
    stage.innerHTML = variants[current]();
    return;
  }
  const f = e.target.closest('[data-filter]');
  if (f) {
    filter = f.dataset.filter;
    stage.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b === f)));
    stage.querySelectorAll('.grid figure').forEach((fig) => { fig.hidden = filter !== 'all' && fig.dataset.style !== filter; });
  }
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
