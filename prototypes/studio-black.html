<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Black Palettes</title>
<link rel="icon" href="../logo-lab/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #0a0a0a; }
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:lang(ko) { word-break: keep-all; }

/* ---------- design tokens: one black system per theme ---------- */
.t-mono {   /* Mono: pure black and bone, contrast carried by type alone */
  --bg: #0a0a0a; --surface: #151515; --fg: #f2f1ee; --muted: #9b9a96; --line: #262626;
  --accent: #f2f1ee; --accent-ink: #0a0a0a; --mark: #f2f1ee;
  --card-bg: #f2f1ee; --card-fg: #0a0a0a; --card-muted: #55534f; --chan-bg: rgba(10,10,10,.06); --chan-hover: rgba(10,10,10,.12);
  --display: Manrope, "Noto Sans KR", sans-serif; --display-weight: 700; --display-track: -.02em; --hello-style: normal; --hello-weight: 600;
  --body: Manrope, "Noto Sans KR", system-ui, sans-serif;
}
.t-seal {   /* Seal: black with vermilion, the red of a Korean ink seal (인주) */
  --bg: #0d0c0b; --surface: #171513; --fg: #efe9e0; --muted: #a39a8e; --line: #2a2622;
  --accent: #e0492f; --accent-ink: #fff; --accent-bg: #c8361f; --mark: #e0492f;
  --card-bg: #171513; --card-fg: #efe9e0; --card-muted: #a39a8e; --chan-bg: rgba(255,255,255,.05); --chan-hover: rgba(224,73,47,.18);
  --display: Newsreader, "Noto Serif KR", serif; --display-weight: 400; --display-track: -.005em; --hello-style: italic; --hello-weight: 400;
  --body: Manrope, "Noto Sans KR", system-ui, sans-serif;
}
.t-celadon { /* Celadon: soft charcoal layers with the green of Korean celadon (청자) */
  --bg: #131313; --surface: #1d1d1c; --fg: #e8e4dc; --muted: #8f8a82; --line: #2b2b29;
  --accent: #9ec2b2; --accent-ink: #131313; --accent-bg: #9ec2b2; --mark: #9ec2b2;
  --card-bg: #1d1d1c; --card-fg: #e8e4dc; --card-muted: #8f8a82; --chan-bg: rgba(158,194,178,.07); --chan-hover: rgba(158,194,178,.16);
  --display: Fraunces, "Noto Serif KR", serif; --display-weight: 300; --display-track: -.01em; --hello-style: italic; --hello-weight: 300;
  --body: Inter, "Noto Sans KR", system-ui, sans-serif;
}

.studio { background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.55; min-height: 100vh; }
.mark { display: inline-block; background: var(--mark); -webkit-mask: url(../logo-lab/a-compass.svg) center / contain no-repeat; mask: url(../logo-lab/a-compass.svg) center / contain no-repeat; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes fade { from { opacity: 0; } }
.in { animation: rise 520ms cubic-bezier(0.23, 1, 0.32, 1) backwards; }
.in.d1 { animation-delay: 60ms; } .in.d2 { animation-delay: 120ms; } .in.d3 { animation-delay: 180ms; } .in.d4 { animation-delay: 240ms; }
@media (prefers-reduced-motion: no-preference) {
  @supports (animation-timeline: view()) {
    .reveal { animation: rise linear backwards; animation-timeline: view(); animation-range: entry 0% entry 60%; }
  }
}
@media (prefers-reduced-motion: reduce) { .in { animation: none; } }
#stage[data-static] .in, #stage[data-static] .photo img { animation: none; }

/* ---------- layout: header on top on phones, right column on desktop ---------- */
.split { display: grid; grid-template-areas: "head" "photo" "copy"; }
@media (min-width: 960px) {
  .split { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; grid-template-areas: "photo head" "photo copy"; min-height: min(100svh, 940px); }
}
.top { grid-area: head; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; }
@media (min-width: 720px) { .top { padding: 28px 48px 0; } }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand .mark { width: 30px; height: 30px; }
.brand b { font-weight: 700; letter-spacing: .2em; font-size: .9rem; font-family: Manrope, sans-serif; }
.top nav { display: flex; align-items: center; gap: 16px; font-size: .88rem; }
.navlinks { display: none; gap: 16px; }
.navlinks a { text-decoration: none; color: var(--muted); transition: color 150ms ease-out; }
.navlinks a:hover { color: var(--fg); }
@media (min-width: 720px) { .navlinks { display: flex; } }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; font-size: .75rem; }
.lang button { border: 0; background: transparent; padding: 5px 10px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.photo { grid-area: photo; position: relative; min-height: 60svh; background: var(--surface); overflow: hidden; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; animation: fade 700ms ease-out backwards; }
.photo::after { content: ""; position: absolute; inset: auto 0 0; height: 30%; background: linear-gradient(transparent, color-mix(in srgb, var(--bg) 70%, transparent)); }
.photo .tag { position: absolute; z-index: 1; left: 16px; bottom: 16px; background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--fg); font-size: .78rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); }

.copy { grid-area: copy; display: flex; flex-direction: column; padding: 0 16px 48px; }
@media (min-width: 720px) { .copy { padding: 0 48px 56px; } }
.intro { margin: auto 0; padding: 40px 0 24px; max-width: 520px; }
.hello { font-family: var(--display); font-style: var(--hello-style); font-weight: var(--hello-weight); font-size: 1.3rem; color: var(--accent); margin: 0 0 10px; }
.t-mono .hello { font-size: .8rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: var(--display-weight); letter-spacing: var(--display-track); font-size: clamp(2.1rem, 1.3rem + 2.8vw, 3.6rem); line-height: 1.1; margin: 0 0 18px; text-wrap: balance; }
.t-mono h1 { line-height: 1.04; }
.lede { color: var(--muted); font-size: 1.04rem; margin: 0 0 18px; text-wrap: pretty; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; padding: 0; margin: 0 0 28px; font-size: .86rem; }
.facts li::before { content: "·"; margin-right: 8px; color: var(--accent); }
.card { background: var(--card-bg); color: var(--card-fg); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.card p { margin: 0; font-size: .9rem; color: var(--card-muted); }
.card .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chan { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; border-radius: 10px; background: var(--chan-bg); text-decoration: none; font-size: .86rem; font-weight: 600; transition: background-color 160ms ease-out, transform 160ms ease-out; }
.chan:hover { background: var(--chan-hover); }
.chan:active { transform: scale(0.97); }
.chan small { font-size: .7rem; font-weight: 400; color: var(--card-muted); }
.chan.primary { background: var(--accent-bg, var(--card-fg)); color: var(--accent-ink); }
.t-mono .chan.primary { background: var(--card-fg); color: var(--card-bg); }
.chan.primary small { color: inherit; opacity: .75; }
.chan.primary:hover { filter: brightness(1.08); }

.work { padding: 72px 16px 40px; max-width: 1240px; margin: 0 auto; }
@media (min-width: 720px) { .work { padding: 88px 32px 48px; } }
.work-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
h2 { font-family: var(--display); font-weight: var(--display-weight); letter-spacing: var(--display-track); font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.6rem); margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 7px 13px; font-size: .84rem; cursor: pointer; transition: background-color 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out; }
.filters button:hover { border-color: var(--fg); color: var(--fg); }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.grid { columns: 2 160px; column-gap: 12px; }
@media (min-width: 900px) { .grid { columns: 4; } }
.grid figure { margin: 0 0 12px; break-inside: avoid; position: relative; border-radius: 8px; overflow: hidden; background: var(--surface); }
.grid figure[hidden] { display: none; }
.grid img { width: 100%; }
.grid figcaption { position: absolute; inset: auto 0 0; padding: 28px 12px 10px; font-size: .8rem; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.7)); opacity: 0; transform: translateY(4px); transition: opacity 180ms ease-out, transform 180ms ease-out; }
.grid figure:hover figcaption { opacity: 1; transform: none; }
@media (hover: none) { .grid figcaption { opacity: 1; transform: none; } }
.how { padding: 24px 16px 72px; max-width: 1240px; margin: 0 auto; }
@media (min-width: 720px) { .how { padding: 24px 32px 88px; } }
.steps { display: grid; gap: 12px; list-style: none; padding: 0; margin: 24px 0 0; }
@media (min-width: 720px) { .steps { grid-template-columns: repeat(3, 1fr); } }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.steps .n { font-family: var(--display); font-size: 1.6rem; color: var(--accent); line-height: 1; display: block; margin-bottom: 10px; }
.steps h3 { margin: 0 0 6px; font-size: 1.02rem; }
.steps p { margin: 0; color: var(--muted); font-size: .93rem; }
footer { padding: 28px 16px 120px; text-align: center; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }

/* ---------- picker (verbatim spec) ---------- */
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Mono</button>
  <button class="proto-picker-item">Seal</button>
  <button class="proto-picker-item">Celadon</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const IMG = '../images/';
const LINKS = {
  kakao: 'https://open.kakao.com/o/siUk2cie',
  instagram: 'https://www.instagram.com/tuzee_tattoo/',
  email: 'mailto:hello@example.com?subject=Tattoo%20idea', // PLACEHOLDER until Zee confirms her address
};
const WORK = [
  { f: 'applications/sacred-geometry-mandala/giant-blackwork-dotwork-mandala-wave-back-tattoo-tuzee.jpg', s: 'mandala', en: 'Dotwork mandala, upper back', ko: '도트워크 만다라, 등' },
  { f: 'applications/fine-line-botanical/yin-yang-koi-fish-red-spider-lily-forearm-tattoo-tuzee.jpg', s: 'fineline', en: 'Koi and spider lily, forearm', ko: '잉어와 꽃무릇, 팔뚝' },
  { f: 'applications/oriental-irezumi/irezumi-skeleton-samurai-dragon-waves-right-arm-sleeve-tuzee.jpg', s: 'oriental', en: 'Samurai and dragon, sleeve', ko: '사무라이와 용, 긴팔' },
  { f: 'applications/sacred-geometry-mandala/ornamental-blackwork-mandala-armor-full-sleeve-tattoo-tuzee.jpg', s: 'mandala', en: 'Ornamental armour, full sleeve', ko: '오너먼트 아머, 긴팔' },
  { f: 'applications/oriental-irezumi/irezumi-twin-koi-lotus-full-back-tattoo-tuzee.jpg', s: 'oriental', en: 'Twin koi and lotus, full back', ko: '쌍잉어와 연꽃, 전체 등' },
  { f: 'applications/ornamental-spine-torso/ornamental-unalome-mandala-spine-tattoo-tuzee-pyeongtaek.jpg', s: 'ornamental', en: 'Unalome mandala, spine', ko: '우날로메 만다라, 척추' },
  { f: 'applications/dark-blackwork-psycore/memento-mori-fallen-angel-engraving-left-forearm-tattoo-tuzee.jpg', s: 'blackwork', en: 'Fallen angel engraving, forearm', ko: '타락천사 판화, 팔뚝' },
  { f: 'applications/sacred-geometry-mandala/large-ornamental-lotus-mandala-upper-back-tattoo-tuzee.jpg', s: 'mandala', en: 'Lotus mandala, upper back', ko: '연꽃 만다라, 등' },
  { f: 'applications/illustrative-realism-script/realistic-black-and-grey-tiger-portrait-calf-tattoo-tuzee.jpg', s: 'realism', en: 'Tiger portrait, calf', ko: '호랑이 초상, 종아리' },
  { f: 'applications/sacred-geometry-mandala/heavy-blackwork-sacred-geometry-mandala-full-sleeve-tattoo-pyeongtaek.jpg', s: 'mandala', en: 'Blackwork geometry, full sleeve', ko: '블랙워크 지오메트릭, 긴팔' },
  { f: 'applications/fine-line-botanical/botanical-red-coffee-cherries-blossoms-leg-tattoo-tuzee.jpg', s: 'fineline', en: 'Coffee branch, leg', ko: '커피나무 가지, 다리' },
  { f: 'applications/sacred-geometry-mandala/colorful-sacred-geometry-mandala-upper-back-tattoo-tuzee.jpg', s: 'mandala', en: 'Colour geometry, upper back', ko: '컬러 지오메트릭, 등' },
];
const STYLES = {
  mandala: { en: 'Mandala & geometry', ko: '만다라 & 지오메트릭' },
  ornamental: { en: 'Ornamental & spine', ko: '오너먼트 & 척추' },
  oriental: { en: 'Oriental & irezumi', ko: '동양화 & 이레즈미' },
  fineline: { en: 'Fine line & botanical', ko: '파인라인 & 보태니컬' },
  realism: { en: 'Realism', ko: '리얼리즘' },
  blackwork: { en: 'Blackwork', ko: '블랙워크' },
};
const T = {
  en: {
    work: 'Work', book: 'Book', all: 'All',
    hello: 'Hi, I’m Zee.',
    h1: 'I draw every tattoo by hand, for one body only: yours.',
    lede: 'Mandalas, ornamental work, oriental pieces and fine line. Each design starts on paper and is fitted to how you move.',
    facts: ['Tattooing since 2011', 'Guest spots in Mexico, Japan, Vietnam', 'English & 한국어'],
    cardP: 'Tell Zee your idea. She reads and answers every message herself.',
    hint: { instagram: 'Send a DM', kakao: '1:1 chat', email: 'Attach photos' },
    selected: 'Selected work',
    howH: 'How booking works',
    steps: [
      ['Send your idea', 'A few words, where on the body, rough size, and any reference photos.'],
      ['Zee draws it', 'You get a custom design and a quote. Changes are part of the process.'],
      ['Your session', 'A private session, then aftercare notes in English or Korean.'],
    ],
    where: 'Capitolium Bldg, Ste 114 · Paengseong-eup, Pyeongtaek',
  },
  ko: {
    work: '작업', book: '예약', all: '전체',
    hello: '안녕하세요, 지(Zee)입니다.',
    h1: '모든 타투를 손으로 그립니다. 오직 당신의 몸을 위해.',
    lede: '만다라, 오너먼트, 동양화, 파인라인. 모든 도안은 종이에서 시작해 몸의 움직임에 맞춰집니다.',
    facts: ['2011년부터 타투 작업', '멕시코 · 일본 · 베트남 게스트 작업', '한국어 & English'],
    cardP: '아이디어를 알려주세요. 모든 메시지는 Zee가 직접 읽고 답장합니다.',
    hint: { instagram: 'DM 보내기', kakao: '1:1 채팅', email: '사진 첨부' },
    selected: '작업',
    howH: '예약 방법',
    steps: [
      ['아이디어 보내기', '원하는 느낌, 부위, 대략적인 크기, 참고 사진을 보내주세요.'],
      ['도안 작업', '맞춤 도안과 견적을 받아보세요. 수정도 과정의 일부입니다.'],
      ['시술', '프라이빗 시술 후 한국어 또는 영어로 애프터케어를 안내해 드립니다.'],
    ],
    where: '평택시 팽성읍 카피톨리움 빌딩 114호',
  },
};
let lang = 'en';
let filter = 'all';
const t = (k) => T[lang][k];
const channels = () => lang === 'ko'
  ? [['kakao', '카카오톡'], ['instagram', 'Instagram'], ['email', '이메일']]
  : [['instagram', 'Instagram'], ['kakao', 'KakaoTalk'], ['email', 'Email']];
const ext = (k) => k === 'email' ? '' : ' target="_blank" rel="noopener"';

function studio(theme) {
  const used = ['all', ...new Set(WORK.map((w) => w.s))];
  return `
  <div class="studio ${theme}" lang="${lang}">
    <div class="split">
      <header class="top in">
        <a class="brand" href="#"><span class="mark" aria-hidden="true"></span><b>TUZEE</b></a>
        <nav aria-label="Main">
          <div class="navlinks"><a href="#work">${t('work')}</a><a href="#how">${t('book')}</a></div>
          <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="en" aria-pressed="${lang === 'en'}">EN</button>
            <button type="button" data-lang="ko" aria-pressed="${lang === 'ko'}">한국어</button>
          </div>
        </nav>
      </header>
      <div class="photo">
        <img src="${IMG}artist-studio/studio-sessions/tuzee-master-tattoo-artist-sacred-geometry-sleeve-session-pyeongtaek.jpg" alt="${lang === 'en' ? 'Zee tattooing a sacred geometry sleeve in her studio' : '스튜디오에서 지오메트릭 슬리브를 작업 중인 Zee'}" width="1440" height="1440" fetchpriority="high">
        <span class="tag">${t('where')}</span>
      </div>
      <div class="copy">
        <div class="intro">
          <p class="hello in d1">${t('hello')}</p>
          <h1 class="in d2">${t('h1')}</h1>
          <p class="lede in d3">${t('lede')}</p>
          <ul class="facts in d3">${t('facts').map((f) => `<li>${f}</li>`).join('')}</ul>
          <div class="card in d4">
            <p>${t('cardP')}</p>
            <div class="row">${channels().map(([k, label], i) => `<a class="chan${i === 0 ? ' primary' : ''}" href="${LINKS[k]}"${ext(k)}>${label}<small>${t('hint')[k]}</small></a>`).join('')}</div>
          </div>
        </div>
      </div>
    </div>
    <section class="work" id="work">
      <div class="work-head reveal">
        <h2>${t('selected')}</h2>
        <div class="filters" role="group" aria-label="Filter by style">
          ${used.map((s) => `<button type="button" data-filter="${s}" aria-pressed="${filter === s}">${s === 'all' ? t('all') : STYLES[s][lang]}</button>`).join('')}
        </div>
      </div>
      <div class="grid">
        ${WORK.map((w) => `<figure data-style="${w.s}"${filter !== 'all' && filter !== w.s ? ' hidden' : ''}><img src="${IMG}${w.f}" alt="${w[lang]}" loading="lazy"><figcaption>${w[lang]}</figcaption></figure>`).join('')}
      </div>
    </section>
    <section class="how reveal" id="how">
      <h2>${t('howH')}</h2>
      <ol class="steps">${t('steps').map(([h, p], i) => `<li><span class="n">0${i + 1}</span><h3>${h}</h3><p>${p}</p></li>`).join('')}</ol>
    </section>
    <footer>TUZEE Tattoo Studio · ${t('where')}</footer>
  </div>`;
}

const variants = [() => studio('t-mono'), () => studio('t-seal'), () => studio('t-celadon')];

// ---------- picker wiring (verbatim reference) ----------
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  delete stage.dataset.static;
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

// ---------- in-variant interactions ----------
stage.addEventListener('click', (e) => {
  const l = e.target.closest('[data-lang]');
  if (l && l.dataset.lang !== lang) {
    lang = l.dataset.lang;
    document.documentElement.lang = lang;
    stage.dataset.static = '';
    stage.innerHTML = variants[current]();
    return;
  }
  const f = e.target.closest('[data-filter]');
  if (f) {
    filter = f.dataset.filter;
    stage.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b === f)));
    stage.querySelectorAll('.grid figure').forEach((fig) => { fig.hidden = filter !== 'all' && fig.dataset.style !== filter; });
  }
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
